<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141a33">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hochstapler">
<title>Hochstapler</title>
<style>
:root{--card:#f4eedf;--onacc:#1b1f33;--felt:#141a33;--ivory:#f4eedf;--ink:#1b1f33;--mut:#a7aec9;--brass:#d9a441;--red:#c23b4e;--line:rgba(244,238,223,.2)}
*{box-sizing:border-box}
html,body,button,a,summary,input{touch-action:manipulation}
button,summary,.chip{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--felt);color:var(--ivory);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:520px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}
h1,h2,.big{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:700}
h1{font-size:40px;margin:10px 0 0;line-height:1.1}
h2{font-size:24px;margin:16px 0 8px;line-height:1.2}
p{margin:6px 0}.mut{color:var(--mut)}.c{text-align:center}
section{border-top:1px solid var(--line);padding:14px 0 6px;margin-top:12px}
button{font:inherit;color:var(--ivory);background:transparent;border:1px solid var(--line);border-radius:10px;padding:13px 16px;width:100%;margin:6px 0;cursor:pointer;transition:background-color .25s ease,border-color .25s ease,color .25s ease}
button.p{background:var(--brass);border-color:var(--brass);color:var(--onacc);font-weight:700}
button:disabled{opacity:.4;cursor:default}
button.on{border-color:var(--brass);background:rgba(217,164,65,.18)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.seg button{margin:0}
input{font:inherit;color:var(--ink);background:var(--card);border:0;border-radius:10px;padding:12px;width:100%}
.chip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:5px 12px;margin:3px 4px 3px 0}
.chip b{cursor:pointer;color:var(--mut)}
.step{flex:none;width:46px;padding:10px;margin:0}
.big{font-size:38px;text-align:center;margin:14px 0;line-height:1.15}
body{min-height:100vh;min-height:100dvh;background-image:repeating-linear-gradient(45deg,rgba(244,238,223,.03) 0 1px,transparent 1px 22px),repeating-linear-gradient(-45deg,rgba(244,238,223,.03) 0 1px,transparent 1px 22px)}
.face{position:relative;display:block;width:100%;background:var(--card);color:var(--ink);border:0;border-radius:16px;padding:40px 20px 30px;margin:12px 0;text-align:center;overflow:hidden;font:inherit;cursor:pointer}
.face::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--brass)}
.face.h::before{background:var(--red)}.face.cv::before{background:#8c93ad}
.face .ic{display:block;margin:0 auto 6px;width:40px;height:40px;object-fit:contain}
.flip{perspective:1200px;height:410px;margin:12px 0;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.45,0,.55,1)}
.flip.on .fi{transform:rotateY(180deg)}
.fi .face{position:absolute;inset:0;width:auto;margin:0;transform:rotateY(180deg);-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;padding:30px 18px 16px}
.fi .face p{margin:5px 0}
.back{position:absolute;inset:0;border-radius:16px;background:var(--card);-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.back::before{content:"";position:absolute;inset:12px;border-radius:8px;border:2px solid var(--brass);background:repeating-linear-gradient(45deg,rgba(217,164,65,.13) 0 1px,transparent 1px 22px),repeating-linear-gradient(-45deg,rgba(217,164,65,.13) 0 1px,transparent 1px 22px),#10162b}
.back::after{content:"";position:absolute;inset:19px;border-radius:5px;border:1px solid rgba(217,164,65,.6)}
.back img,.back i{position:relative;z-index:1;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.back{transition:opacity 0s linear .3s,visibility 0s linear .3s}.flip.on .back{opacity:0;visibility:hidden}
.back img{width:140px}
.back i{font:italic 19px Baskerville,"Baskerville Old Face",Palatino,Georgia,serif;color:var(--brass);margin-top:22px}
.qrw{overflow:hidden;max-height:230px;opacity:1;transition:max-height .45s ease,opacity .35s ease}
.qrw.off{max-height:0;opacity:0}
@media (prefers-reduced-motion:reduce){.fi,.qrw{transition:none}}
.face p{color:var(--ink)}.face .mut{color:#5b6075}
.logo{display:block;width:50px;height:50px;object-fit:contain;margin:6px 0 0}
h1.t{font-family:"Didot","Bodoni 72","Bodoni MT","Playfair Display","Iowan Old Style",Georgia,serif;font-weight:400;font-size:33px;letter-spacing:.14em;text-transform:uppercase;text-align:center;margin:6px 0 4px;line-height:1.15}
ol.ord{list-style:none;padding:0;margin:8px 0;counter-reset:o}
.ord li{counter-increment:o;display:flex;align-items:center;gap:12px;padding:7px 0;font-size:18px}
.ord li::before{content:counter(o);flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--brass);color:var(--brass);display:flex;align-items:center;justify-content:center;font:italic 16px Baskerville,"Palatino Linotype",Georgia,serif}
.ord li:first-child{font-weight:600}.ord li:first-child::before{background:var(--brass);color:var(--felt);font-style:normal;font-weight:600}
.ord li i{font:italic 15px Baskerville,"Palatino Linotype",Georgia,serif;font-weight:400;color:var(--mut)}
.wn{font-family:"Didot","Bodoni 72","Bodoni MT","Playfair Display","Iowan Old Style",Georgia,serif;color:var(--brass);font-size:22px;letter-spacing:.08em;text-transform:uppercase;margin:4px 0 8px;line-height:1.2}
section>b:first-child{display:block;margin-bottom:8px;font:italic 700 18px Baskerville,"Baskerville Old Face",Palatino,"Palatino Linotype",Georgia,serif;letter-spacing:.02em;color:var(--brass)}
p.s{font-size:14.5px;line-height:1.4;text-align:center;margin:6px 0 14px}
h1.t.m{font-size:26px;letter-spacing:.1em;margin-top:18px}
.sub{font-family:"Baskerville","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Serif",serif;font-style:italic;font-size:19px;letter-spacing:.02em;color:var(--mut);text-align:center;margin:4px 0 14px}
.logo.mid{width:105px;height:auto;margin:4px auto 0}
.code{font-family:"Didot","Bodoni 72","Bodoni MT","Playfair Display","Iowan Old Style",Georgia,serif;font-size:46px;letter-spacing:.2em;padding-left:.2em;text-align:center;line-height:1.15;margin:6px 0 0}
.logo.big{width:210px;height:auto;max-height:none;margin:18px auto 6px}
table{width:100%;border-collapse:collapse}td,th{padding:7px 2px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}.n{text-align:right;white-space:nowrap;padding-left:10px}
.tag{font-size:13px;border-radius:8px;padding:2px 8px;background:var(--red);color:var(--ivory)}
.g{color:#9be0a8}.r{color:#ffa79d}
details{border-top:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;margin:6px 0;font-weight:700}
a.chip{color:var(--ivory);text-decoration:none}
.bar{display:flex;justify-content:space-between;margin-bottom:-8px}.bar .x{margin:0}
details p,details li{color:var(--ivory)}
.x{display:block;width:44px;height:44px;padding:0;margin:0 0 -8px;border-radius:50%;font-size:20px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.cat{transition:opacity .3s ease,border-color .3s ease,background-color .3s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;min-height:98px;margin:0;padding:8px 4px;font-size:13px;line-height:1.25;border-radius:12px;overflow-wrap:anywhere;hyphens:auto;opacity:1;border-color:#474d68}
.cat>*{transition:opacity .3s ease}.cat:not(.on)>*{opacity:.55}.cat.img:not(.on)>*{opacity:.8}
.cat.img{position:relative;background-size:cover;background-position:center;background-clip:padding-box;border-color:#474d68;opacity:1}
.cat.img::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--felt);opacity:.5;transition:opacity .3s ease;z-index:2;pointer-events:none}
.cat.img.on::after{opacity:0}
.cat.img::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(to top,rgba(20,26,51,.92),rgba(20,26,51,.5) 55%,rgba(20,26,51,.25))}
.cat.img{justify-content:flex-end;padding-bottom:5px}.cat.img span{display:flex;align-items:center;justify-content:center;min-height:3.75em}
.cat.img>*{position:relative;z-index:3}.cat.img i{display:none}.cat.img span{font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.cat.on{opacity:1}.cat.img.on{border-color:var(--brass);border-width:2px}.cat.ro{pointer-events:none}
.cat i{font-style:normal;font-size:24px;line-height:1}

button.sw{margin-top:22px;border:2px solid transparent;background:linear-gradient(var(--felt),var(--felt)) padding-box,linear-gradient(90deg,#e8503a,#f7a52d,#f7d02d,#3caa5a,#2e7dde,#8a4fd0) border-box;font-weight:700}
.logo.big svg,svg.logo.big{display:block}

 const rbAt=t=>{const f=Math.min(Math.max(t,0),1)*(RB.length-1),a=Math.floor(f),b=Math.min(a+1,RB.length-1),u=f-a,A=hx(RB[a]),B=hx(RB[b]);return A.map((v,k)=>Math.round(v+(B[k]-v)*u))};
 const st=document.documentElement.style,W=480,H=80;
 const make=(name,seed,colAt)=>{let sd=seed;const rnd=()=>{sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const rg=(c,a,f=1)=>`rgba(${c.map(v=>Math.round(v*f)).join(',')},${a})`;
  const pts=[];for(let x=W+14;x>=-14;x-=16)pts.push([x,44+(rnd()-.5)*12+Math.sin(x/31)*5]);
  const P=new Path2D();P.moveTo(-14,-14);P.lineTo(W+14,-14);P.lineTo(pts[0][0],pts[0][1]);
  for(let k=1;k<pts.length-1;k++){const a=pts[k],b=pts[k+1];P.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}P.lineTo(-14,pts[pts.length-1][1]);P.closePath();
  const grad=(al,f=1)=>{const q=g.createLinearGradient(0,0,W,0);for(let k=0;k<=12;k++){const t=k/12;q.addColorStop(t,rg(colAt(t),al,f))}return q};
  g.fillStyle=grad(.8);g.fill(P);
  g.save();g.clip(P);
  for(let k=0;k<14;k++){const x=rnd()*W,y=8+rnd()*38,rx=30+rnd()*70,ry=6+rnd()*12;g.beginPath();g.ellipse(x,y,rx,ry,(rnd()-.5)*.3,0,7);g.fillStyle=rg(colAt(x/W),.14+rnd()*.14,.78);g.fill()}
  for(let k=0;k<10;k++){const x=rnd()*W,y=6+rnd()*32;g.beginPath();g.ellipse(x,y,20+rnd()*60,1.5+rnd()*3,(rnd()-.5)*.2,0,7);g.fillStyle=`rgba(255,255,255,${.18+rnd()*.18})`;g.fill()}
  for(let k=0;k<700;k++){const x=rnd()*W,y=rnd()*H,r=.6+rnd()*1.6;g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=rnd()<.5?`rgba(255,255,255,${.05+rnd()*.12})`:rg(colAt(x/W),.1+rnd()*.14,.6);g.fill()}
  g.restore();
  g.lineJoin='round';g.lineWidth=6;g.strokeStyle=grad(.12,.7);g.stroke(P);g.lineWidth=2.4;g.strokeStyle=grad(.5,.62);g.stroke(P);
  for(let k=0;k<5;k++){const x=30+rnd()*(W-60),y=pts.reduce((m,p)=>Math.abs(p[0]-x)<Math.abs(m[0]-x)?p:m)[1]+2,len=7+rnd()*14,w=2.6+rnd()*1.6,c=colAt(x/W);
   g.beginPath();g.moveTo(x-w,y-4);g.lineTo(x+w,y-4);g.lineTo(x+w*.8,y+len);g.arc(x,y+len,w*.9,0,Math.PI);g.lineTo(x-w,y-4);g.fillStyle=rg(c,.78);g.fill();g.lineWidth=1.8;g.strokeStyle=rg(c,.5,.62);g.stroke()}
  st.setProperty('--'+name,'url('+cv.toDataURL('image/png')+')')};
 PC.forEach((p,i)=>{const c=hx(p[1]);make('s'+i,i*104729+7,()=>c)});
 make('sr',99991,rbAt)}

let ICOON=false;
function mkIcons(){if(ICOON)return;ICOON=true;const st=document.documentElement.style;st.setProperty('--mk','url('+ICOMASK+')');
 const im=new Image();im.onload=()=>{const S=im.naturalWidth,cv=document.createElement('canvas');cv.width=cv.height=S;const g=cv.getContext('2d');g.drawImage(im,0,0);const src=g.getImageData(0,0,S,S);
  const sm=(x,a,b)=>{const t=Math.min(Math.max((x-a)/(b-a),0),1);return t*t*(3-2*t)};
  PC.forEach((p,i)=>{const T=[1,3,5].map(k=>parseInt(p[1].substr(k,2),16)),d=new ImageData(new Uint8ClampedArray(src.data),S,S),a=d.data;
   for(let k=0;k<a.length;k+=4){if(!a[k+3])continue;const r=a[k],q=a[k+1],b=a[k+2],mx=Math.max(r,q,b),mn=Math.min(r,q,b),sat=mx?(mx-mn)/mx:0,w=sm(sat,.45,.65);if(w<=0)continue;
    const lum=(.299*r+.587*q+.114*b)/255,f=Math.min(1.15,Math.max(.62,.78+(lum-.5)*.9));
    for(let c=0;c<3;c++){const nv=Math.min(255,Math.max(T[c]*f,22));a[k+c]=a[k+c]*(1-w)+nv*w}}
   g.putImageData(d,0,0);st.setProperty('--pi'+i,'url('+cv.toDataURL('image/png')+')')})};im.src=ICOPEN}
let BLOT=false;
function mkBlots(){if(BLOT)return;BLOT=true;mkIcons();if(!BAND){BAND=true;mkBands()}const st=document.documentElement.style,S=128;
 PC.forEach((p,i)=>{let sd=i*7919+13;const rnd=()=>{sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const cv=document.createElement('canvas');cv.width=cv.height=S;const g=cv.getContext('2d');
  const rgb=[1,3,5].map(k=>parseInt(p[1].substr(k,2),16)),rgba=(a,f=1)=>`rgba(${rgb.map(v=>Math.round(v*f)).join(',')},${a})`;
  const blob=(cx,cy,R,j)=>{const n=16,pts=[],P=new Path2D();for(let k=0;k<n;k++){const a=k/n*Math.PI*2,r=R*(1+j*(rnd()-.5));pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}
   const l=pts[n-1];P.moveTo((l[0]+pts[0][0])/2,(l[1]+pts[0][1])/2);for(let k=0;k<n;k++){const a=pts[k],b=pts[(k+1)%n];P.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}P.closePath();return P};
  const base=blob(64,64,48,.3);g.fillStyle=rgba(.74);g.fill(base);
  g.save();g.clip(base);
  for(let k=0;k<5;k++){const q=blob(64+(rnd()-.5)*34,64+(rnd()-.5)*34,24+rnd()*18,.45);g.fillStyle=rgba(.2+rnd()*.14,.8);g.fill(q)}
  const gr=g.createRadialGradient(54+rnd()*8,52+rnd()*8,2,62,60,34);gr.addColorStop(0,'rgba(255,255,255,.3)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,S,S);
  for(let k=0;k<460;k++){const x=rnd()*S,y=rnd()*S,r=.6+rnd()*1.7;g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=rnd()<.5?`rgba(255,255,255,${.05+rnd()*.12})`:rgba(.1+rnd()*.14,.6);g.fill()}
  g.restore();
  g.lineJoin='round';g.lineWidth=7;g.strokeStyle=rgba(.14,.7);g.stroke(base);g.lineWidth=2.6;g.strokeStyle=rgba(.55,.62);g.stroke(base);
  for(let k=0;k<4;k++){const a=rnd()*7,d=53+rnd()*6,r=1.6+rnd()*2.4;g.beginPath();g.arc(64+Math.cos(a)*d,64+Math.sin(a)*d,r,0,7);g.fillStyle=rgba(.6);g.fill()}
  st.setProperty('--b'+i,'url('+cv.toDataURL('image/png')+')')})}

const colOf=n=>PC[C.col&&Number.isInteger(C.col[n])?C.col[n]:0];

let CPK=-1;
function cpOpen(i){CPK=CPK===i?-1:i;setupF(true)}
function cpSet(i,ci){const n=C.names[i],o=C.names.find(x=>C.col[x]===ci);if(o&&o!==n)C.col[o]=C.col[n];C.col[n]=ci;CPK=-1;save();setupF(true)}
async function drawWordF(){
 try{const r=await fetch(API+'/api/draw',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:TOK,game:'f'})});
  if(r.ok){const j=await r.json();if(j.w&&j.g==='f'){if(WN!==null)WN++;return{w:j.w}}}}catch(e){}
 return drawLocalF()}
function drawLocalF(){let U=[];try{U=JSON.parse(localStorage.getItem('hs_used_f')||'[]')}catch(e){}
 let p=FW.filter(w=>!U.includes(w));if(!p.length){U=[];p=FW}
 const w=p[Math.random()*p.length|0];U.push(w);try{localStorage.setItem('hs_used_f',JSON.stringify(U))}catch(e){}return{w}}
function setupF(keep){

 const n=C.names.length,geh=C.mode==='geheim',lim=maxK(n),minN=geh?5:4;

function morph(a,b){
 const A=[...a.childNodes],B=[...b.childNodes];
 B.forEach((nb,i)=>{const na=A[i];
  if(!na){a.appendChild(nb.cloneNode(true));return}
  if(na.nodeType!==nb.nodeType||na.nodeName!==nb.nodeName){a.replaceChild(nb.cloneNode(true),na);return}
  if(nb.nodeType===3){if(na.nodeValue!==nb.nodeValue)na.nodeValue=nb.nodeValue;return}
  if(nb.nodeType!==1)return;
  const keepV=/^(INPUT|TEXTAREA|SELECT)$/.test(na.nodeName),det=na.nodeName==='DETAILS',img=na.nodeName==='IMG';
  [...na.attributes].forEach(t=>{if(!nb.hasAttribute(t.name)&&!(keepV&&t.name==='value')&&!(det&&t.name==='open')&&!(img&&(t.name==='src'||t.name==='onerror')))na.removeAttribute(t.name)});
  [...nb.attributes].forEach(t=>{if((keepV&&t.name==='value')||(det&&t.name==='open')||(img&&(t.name==='src'||t.name==='onerror')))return;if(na.getAttribute(t.name)!==t.value)na.setAttribute(t.name,t.value)});
  morph(na,nb)});

async function drawWord(){if(GM==='f')return drawWordF();
 try{const r=await fetch(API+'/api/draw',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:TOK,cats:C.cats,lv:C.lv})});
  if(r.ok){const j=await r.json();if(j.w){if(WN!==null)WN++;return{w:j.w,c:j.c||(CATS.find(c=>c.w.some(l=>l.includes(j.w)))||{}).id}}}}catch(e){}
 return drawLocal()}
function drawLocal(){
 let U=[];try{U=JSON.parse(localStorage.getItem('hs_used')||'[]')}catch(e){}
 const P=[];CATS.filter(c=>C.cats.includes(c.id)).forEach(c=>c.w.forEach((l,i)=>{if(C.lv.includes(LV[i]))l.forEach(w=>P.push({w,c:c.id}))}));
 let p=P.filter(x=>!U.includes(x.w));
 if(!p.length){const ws=P.map(x=>x.w);U=U.filter(w=>!ws.includes(w));p=P}
 const r=p[Math.random()*p.length|0];U.push(r.w);
 try{localStorage.setItem('hs_used',JSON.stringify(U))}catch(e){}
 return r}

function result1(){
 const P=C.names,I=G.imp,V=P.filter(x=>!I.includes(x)),th=Math.ceil(V.length/2);
 G.cnt={};P.forEach(x=>G.cnt[x]=V.filter(v=>G.votes[v].includes(x)).length);
 G.ent={};I.forEach(h=>G.ent[h]=G.cnt[h]>=th);
 const s=[...P].sort((a,b)=>G.cnt[b]-G.cnt[a]);
 show(`${HD('Auflösung','Die Masken fallen')}<p class="mut s">Enttarnt ist, wer von mindestens ${th} der ${V.length} Mitspieler getippt wurde. Tipps der Hochstapler zählen nicht.</p>
 <section><table>${s.map(x=>`<tr><td>${pn(x)} ${I.includes(x)?'<span class="tag">Hochstapler</span>':''}</td><td class="n">${G.cnt[x]} Stimme${G.cnt[x]===1?'':'n'}</td></tr>`).join('')}</table></section>
 ${I.map(h=>`<p>${G.ent[h]?'🔍':'😎'} <b>${pn(h)}</b> ${G.ent[h]?'wurde enttarnt.':'blieb unentdeckt.'}</p>`).join('')}
 <details><summary>Wer hat wen getippt?</summary>${P.map(x=>`<p>${pn(x)} tippt auf ${G.votes[x].map(pn).join(', ')}</p>`).join('')}</details>
 <button class="p" onclick="guess(0)">Weiter zum Wort raten</button>`);
}
function guess(j){
 const h=G.imp[j];
 if(!h){result2();return}
 show(`${HD('Das Wort',pn(h)+' rät')}<p>${pn(h)} nennt laut einen Begriff, nur ein Versuch. Alle anderen kennen das Wort und entscheiden:</p>
 <button class="p" onclick="ans(${j},true)">✓ Richtig</button><button onclick="ans(${j},false)">✕ Falsch</button>`);
}
function ans(j,v){G.guess[G.imp[j]]=v;guess(j+1)}
function result2(){
 const P=C.names,I=G.imp,V=P.filter(x=>!I.includes(x)),geh=C.mode==='geheim',turn=C.type==='turnier';
 const won={};I.forEach(h=>won[h]=!G.ent[h]||G.guess[h]);
 const allLost=I.every(h=>!won[h]),d={};P.forEach(x=>d[x]=0);
 I.forEach(h=>d[h]=(G.ent[h]?0:2)+(G.guess[h]?2:0));
 V.forEach(v=>{const t=G.votes[v];let s=allLost?1:0;
  if(geh){if(t.length>G.k)s-=t.length-G.k;else{const h=t.filter(x=>I.includes(x)).length;s+=h;if(G.k>1&&h===G.k)s++}}
  else{const h=t.filter(x=>G.ent[x]).length;s+=h;if(G.k>1&&h===G.k)s++}
  d[v]=s});
 if(turn)P.forEach(x=>SC[x]+=d[x]);
 const W=allLost?V:I.filter(h=>won[h]),last=turn&&RN>=C.rounds,S=[...P].sort((a,b)=>SC[b]-SC[a]);

 <section class="c"><div class="wn">${allLost?'Die Mitspieler gewinnen':W.length>1?'Es gewinnen die Hochstapler':'Es gewinnt der Hochstapler'}</div><p>${W.map(pn).join(', ')}</p></section>
 ${turn?`<section><b>${last?'Endstand':`Stand nach Runde ${RN} von ${C.rounds}`}</b><table><tr><th>Spieler</th><th class="n">Runde</th><th class="n">Gesamt</th></tr>${S.map(x=>`<tr><td>${last&&SC[x]===SC[S[0]]?'🥇 ':''}${pn(x)}${I.includes(x)?' 🎭':''}</td><td class="n ${d[x]<0?'r':d[x]>0?'g':''}">${d[x]>0?'+':''}${d[x]}</td><td class="n"><b>${SC[x]}</b></td></tr>`).join('')}</table></section>`:''}
 ${turn?(last?'<button class="p" onclick="setup()">Neues Spiel</button>':'<button class="p" onclick="RN++;newRound()">Nächste Runde</button>'):'<button class="p" onclick="newRound()">Noch eine Runde</button>'}`);
}

  <section><b>Raum beitreten</b><div class="row" style="margin-top:8px"><input id="rc" placeholder="Raumcode" maxlength="4" style="text-transform:uppercase"><button style="flex:none;width:110px;margin:0" onclick="nameScreen($('rc').value)">Weiter</button></div></section>
  <section><button onclick="setup()">Ein Handy (Pass-and-Play)</button><button onclick="rules('home')">Regeln</button></section>
  <button class="sw" onclick="switchGame('h')">🎭 <span data-n>Zu Hochstapler wechseln</span></button>
  <p class="c mut" style="margin-top:18px;font-size:14px">Version ${VERSION}</p>`)}
async function create(){const r=await jpost('/api/create',{token:TOK,game:GM}).catch(()=>null);
 if(!r)return alert('Der Server ist nicht erreichbar.');if(r.status===401)return gate('Bitte neu anmelden.');if(!r.ok)return alert('Der Raum konnte nicht erstellt werden.');
 const j=await r.json();if(GM==='f'&&j.g!=='f')return alert('Der Server muss für Kunstfälscher zuerst aktualisiert werden: worker.js neu auf Cloudflare hochladen.');const cd=j.code;NEWROOM=cd;nameScreen(cd)}
function nameScreen(code){code=(code||'').trim().toUpperCase().replace(/[^A-Z]/g,'');if(code.length!==4)return alert('Der Raumcode hat 4 Buchstaben.');
 let n='';try{n=store.getItem('hs_name')||''}catch(e){}
 show(`<button class="x" aria-label="Zurück" onclick="home()">←</button>${LOGOM()}<div class="code">${code}</div><p class="sub" style="margin:6px 0 14px">Wie heißt du?</p><input id="nm2" maxlength="14" value="${esc(n)}" placeholder="Name" onkeydown="if(event.key==='Enter')join('${code}')"><button class="p" style="margin-top:12px" onclick="join('${code}')">Beitreten</button>`)}
function join(code){const n=$('nm2').value.trim();if(!n)return;try{store.setItem('hs_name',n)}catch(e){}connect(code,n)}
function connect(code,name){myCode=code;mpOn=true;inGame=false;
 let pid=null;try{pid=store.getItem('hs_pid_'+code)}catch(e){}
 let got=false;const w=ws=new WebSocket(API.replace(/^http/,'ws')+'/ws?raum='+code);
 w.onopen=()=>w.send(JSON.stringify({t:'join',name,pid}));
 w.onmessage=e=>{got=true;const m=JSON.parse(e.data);
  if(m.t==='me'){try{store.setItem('hs_pid_'+code,m.pid)}catch(x){}}
  else if(m.t==='note'){alert(m.e)}
  else if(m.t==='err'){mpOn=false;try{w.close()}catch(x){}alert(m.e);home()}
  else{if(NEWROOM===code&&m.ph==='lobby'&&m.me===m.host){NEWROOM='';try{const sc=JSON.parse(localStorage.getItem(GM==='f'?'hs_mpcfg_f':'hs_mpcfg')||'null');if(sc)mx('setcfg',{cfg:sc})}catch(x){}}
   M=m;setGame(m.cfg&&m.cfg.game);OFF=(m.now||Date.now())-Date.now();if(!inRules)mp()}};
 w.onclose=()=>{if(!mpOn||ws!==w)return;if(!got){mpOn=false;alert('Der Raum wurde nicht gefunden oder der Server ist nicht erreichbar.');home()}else setTimeout(()=>mpOn&&connect(code,name),1500)}}
function leave(){
 if(M&&M.me===M.host&&M.ph!=='lobby'){if(confirm('Spiel für alle beenden und zurück zur Lobby?'))mx('end')}
 else if(confirm('Willst du den Raum wirklich verlassen? Mit dem Raumcode kommst du wieder hinein.'))home()}
const qrImg=u=>{try{if(typeof qrcode!=='function')return '';const q=qrcode(0,'M');q.addData(u);q.make();return `<div class="c" style="margin:8px 0"><img alt="QR-Code zum Beitreten" src="${q.createDataURL(5,2)}" style="width:190px;height:190px;image-rendering:pixelated;border-radius:8px"></div>`}catch(e){return ''}};
function kick(id){const p=M.players.find(x=>x.id===id);if(p&&confirm(p.name+' aus dem Raum entfernen?'))mx('kick',{id})}
function share(){const u=location.origin+location.pathname+'?raum='+myCode;
 if(navigator.share)navigator.share({title:GM==='f'?'Kunstfälscher':'Hochstapler',text:'Komm in meinen Raum '+myCode,url:u}).catch(()=>{});
 else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>alert('Link kopiert'))}
function tg2(id){const a=SEL.indexOf(id);if(a>=0)SEL.splice(a,1);else if(M.cfg.mode==='geheim'||SEL.length<M.k)SEL.push(id);else if(M.k===1)SEL=[id];mp(true)}
const cseg=(o,cur,k)=>`<div class="row seg">${o.map(([v,l])=>`<button class="${v===cur?'on':''}" onclick="mx('cfg',{k:'${k}',v:'${v}'})">${l}</button>`).join('')}</div>`;
const cstp=(l,v,k)=>stp(l,v,`mx('cfg',{k:'${k}',d:-1})`,`mx('cfg',{k:'${k}',d:1})`);
function mp(keep){
 const m=M,P=m.players,c=m.cfg,H=m.me===m.host,n=P.length,minN=c.mode==='geheim'?5:4,b=c.mode==='bekannt';
 const nm=id=>pnp(P.find(p=>p.id===id)||{name:'?'}),nmc=id=>pnpc(P.find(p=>p.id===id)||{name:'?'});if(m.ph!=='lobby')CPKM=false;const myc=(P.find(p=>p.id===m.me)||{}).col||0;
 const okS=n>=minN&&(GM==='f'||(c.cats&&c.cats.length));
 TEND=m.ph==='talk'&&m.tend?m.tend:0;
 const offl=P.filter(p=>!p.on);let off='';
 if(H&&m.ph!=='lobby'&&m.ph!=='result'&&offl.length){const nn=offl.map(p=>esc(p.name)).join(', '),okr=n-offl.length>=minN;off=`<section><p class="mut">Nicht verbunden: ${nn}</p><button ${okr?'':'disabled'} onclick="mx('restart')">Runde ohne ${nn} neu starten</button>${okr?'':'<p class="mut">Dafür sind zu wenige Spieler übrig.</p>'}</section>`}
 const fresh=m.ph!==lastPh;if(fresh&&m.ph==='vote')SEL=[];if(m.ph==='role'&&(fresh||m.round!==lastRound)){REVL=false;REVSEEN=false}lastPh=m.ph;lastRound=m.round;
 let h='';
 if(m.ph==='lobby'){
  h=`${LOGOM()}<div class="code">${m.code}</div><p class="sub" style="margin:0 0 10px">Raumcode</p>${H?`<div id="qrw" class="qrw${QRON?'':' off'}">${qrImg(location.origin+location.pathname+'?raum='+m.code)}</div>`:''}<div class="row">${H?`<button id="qrb" onclick="qrTog()">${QRON?'QR ausblenden':'QR anzeigen'}</button>`:''}<button onclick="share()">${H?'Link teilen':'Einladungslink teilen'}</button></div>
  <section><b>Spieler (${n})</b>${plList(m,H)}<p class="mut">Mindestens ${minN} Spieler${GM==='f'?', höchstens 12. Tippe auf deinen Farbpunkt, um deine Farbe zu ändern.':''}</p></section>`
  +(TEST?`<section><b>Testmodus</b><p class="mut">Weitere Spieler in neuen Tabs öffnen:</p>${[2,3,4,5,6].map(i=>`<a class="chip" target="_blank" rel="noopener" href="${location.origin+location.pathname}?raum=${m.code}&test=1&name=Spieler%20${i}">Spieler ${i}</a>`).join('')}</section>`:'')
  +(H?`<button class="p" style="margin-top:6px" ${okS?'':'disabled'} onclick="mx('start')">Spiel starten</button>${okS?'':`<p class="mut c">${n<minN?`Es fehlen noch ${minN-n} Spieler.`:'Wähle mindestens eine Kategorie.'}</p>`}<section><b>Spielart</b>${cseg([['blitz','Blitzrunde'],['turnier','Turnier']],c.type,'type')}${c.type==='turnier'?cstp('Runden',c.rounds,'rounds'):''}</section>
  <section><b>Hochstapler</b>${cseg([['bekannt','Anzahl bekannt'],['geheim','Geheim']],c.mode,'mode')}${b?cstp('Anzahl',c.k,'k'):cstp('Maximal',c.max,'max')}</section>
  ${GM==='f'?fSec():catSec(c,true)}
  <section><b>Timer für die Diskussion</b><div class="row seg">${[0,1,2,3,5].map(v=>`<button class="${(c.timer||0)===v?'on':''}" onclick="mx('cfg',{k:'timer',v:${v}})">${v||'Aus'}</button>`).join('')}</div><p class="mut">Minuten</p></section>`
  :`<section><p>${c.type==='turnier'?`Turnier mit ${c.rounds} Runden`:'Blitzrunde'}, ${b?`${c.k} Hochstapler`:`Geheim mit höchstens ${c.max} Hochstaplern`}.</p><p class="mut">${c.timer?`Timer: ${c.timer} Min. `:''}${nm(m.host)} startet das Spiel.</p></section>`+(GM==='f'?'':c.cats?catSec(c,false):''))
  +`<button onclick="rules('mpBack')">Regeln</button><p class="c mut" style="margin-top:18px;font-size:14px">Version ${VERSION} · Server ${m.wv||'veraltet'}</p>`;
 }else if(m.ph==='role'){const r=m.role,k=m.k;
  h=r.seen?`${HD('Einen Moment','Die anderen sehen noch ihre Karte')}<p class="c mut">${r.n} von ${n} haben ihre Rolle gesehen.</p>`
  :(r.imp?FLIP(`${ICO(1,myc)}<p class="mut">Du bist</p><div class="big">der Hochstapler</div><p>Bluffe dich durch.</p><p class="mut">${b?`Es gibt ${k} Hochstapler.`:'Wie viele Hochstapler es gibt, weißt du nicht.'}</p>${r.cat?catLine(r.cat):''}${HIDE}`,GM==='f'?'cb'+myc:'h',REVL,'mpFlip()','fl')
   :FLIP(`${ICO(0,myc)}<p class="mut">Dein Wort</p>${BW(r.word)}<p class="mut">${b?`Unter euch ${k==1?'ist 1 Hochstapler':'sind '+k+' Hochstapler'}.`:`Unter euch sind höchstens ${c.max} Hochstapler.`}</p>${r.cat?catLine(r.cat):''}${HIDE}`,GM==='f'?'cb'+((P.find(p=>p.id===m.me)||{}).col||0):'',REVL,'mpFlip()','fl'))
   +`<p class="mut c" style="font-size:14px">Achte darauf, dass niemand mitliest.</p><button class="p" id="vb" ${REVSEEN?'':'disabled'} onclick="mx('seen')">Verstanden</button>`;
 }else if(m.ph==='talk'){
  h=`${c.type==='turnier'?`<p class="mut">Runde ${m.round} von ${c.rounds}</p>`:''}${HD('Hinweisrunde','Nenne ein Hinweiswort, ohne dich zu verraten.')}${m.tend?'<p id="tm" class="c mut"></p>':''}
  <section><b>Reihenfolge</b><ol class="ord">${m.order.map((i,j)=>`<li>${nmc(i)}${j?'':' <i>beginnt</i>'}</li>`).join('')}</ol></section>${c.cats?catDet(c.cats):''}${GM==='f'?'<p>Zwei Durchgänge: Zuerst zeichnet jeder eine Linie, danach in derselben Reihenfolge eine zweite.</p>':''}<p>Danach wird frei diskutiert.</p>`
  +(H?`<button class="p" onclick="mx('next')">Zur Abstimmung</button>`:`<p class="c mut">${nm(m.host)} startet die Abstimmung.</p>`);
 }else if(m.ph==='vote'){const ok=b?SEL.length===m.k:SEL.length>=1;
  h=HD('Abstimmung','Wer ist der Hochstapler?')+(m.my?`<p class="mut">Dein Tipp ist abgegeben: ${m.my.map(nm).join(', ')}.</p><p class="c">${m.voted} von ${n} haben getippt.</p>`
   :`<p class="mut s">${b?`Es gibt ${m.k} Hochstapler. Wähle genau ${m.k}.`:'Wähle beliebig viele Verdächtige. Wer mehr tippt, als es Hochstapler gibt, verliert Punkte.'}</p>`
   +P.map(p=>p.id===m.me?'':`<button class="${SEL.includes(p.id)?'on':''}" onclick="tg2('${p.id}')">${SEL.includes(p.id)?'✓ ':''}${pnpc(p)}</button>`).join('')
   +`<button class="p" style="margin-top:14px" ${ok?'':'disabled'} onclick="mx('vote',{ids:SEL})">Tipp abgeben (${SEL.length}${b?' von '+m.k:''})</button>`);
 }else if(m.ph==='reveal'){const r=m.rev,S=[...P].sort((a,z)=>r.cnt[z.id]-r.cnt[a.id]);
  h=`${HD('Auflösung','Die Masken fallen')}<p class="mut s">Enttarnt ist, wer von mindestens ${r.th} der ${r.nv} Mitspieler getippt wurde. Tipps der Hochstapler zählen nicht.</p>
  <section><table>${S.map(p=>`<tr><td>${pnp(p)} ${r.imp.includes(p.id)?'<span class="tag">Hochstapler</span>':''}</td><td class="n">${r.cnt[p.id]} Stimme${r.cnt[p.id]===1?'':'n'}</td></tr>`).join('')}</table></section>
  ${r.imp.map(i=>`<p>${r.ent[i]?'🔍':'😎'} <b>${nm(i)}</b> ${r.ent[i]?'wurde enttarnt.':'blieb unentdeckt.'}</p>`).join('')}
  <details><summary>Wer hat wen getippt?</summary>${P.map(p=>`<p>${pnp(p)} tippt auf ${(r.votes[p.id]||[]).map(nm).join(', ')}</p>`).join('')}</details>`
  +(H?`<button class="p" onclick="mx('next')">Weiter zum Wort raten</button>`:`<p class="c mut">Das Spiel geht weiter.</p>`);
 }else if(m.ph==='guess'){const gu=m.guesser,jd=m.judge;
  h=HD('Das Wort',nm(gu)+' rät')+(m.me===jd?`<p>${nm(gu)} nennt laut einen Begriff, nur ein Versuch. Stimmt es?</p><button class="p" onclick="mx('ans',{v:true})">✓ Richtig</button><button onclick="mx('ans',{v:false})">✕ Falsch</button>`
   :m.me===gu?`<p>Nenne laut einen Begriff, nur ein Versuch.</p><p class="mut">${nm(jd)} entscheidet, ob es stimmt.</p>`
   :`<p>${nm(gu)} nennt laut einen Begriff. ${nm(jd)} entscheidet, ob es stimmt.</p>`);
 }else if(m.ph==='result'){const R=m.res,turn=c.type==='turnier',S=[...P].sort((a,z)=>z.sc-a.sc);
  h=`<p class="c mut" style="margin-top:12px">Das Wort war</p><div class="big" style="margin-top:0">${esc(R.word)}</div>${R.cat?`<div class="c">${catLine(R.cat)}</div>`:''}
  <section class="c"><div class="wn">${R.allLost?'Die Mitspieler gewinnen':R.W.length>1?'Es gewinnen die Hochstapler':'Es gewinnt der Hochstapler'}</div><p>${R.W.map(nm).join(', ')}</p></section>`
  +(turn?`<section><b>${R.last?'Endstand':`Stand nach Runde ${m.round} von ${c.rounds}`}</b><table><tr><th>Spieler</th><th class="n">Runde</th><th class="n">Gesamt</th></tr>${S.map(p=>`<tr><td>${R.last&&p.sc===S[0].sc?'🥇 ':''}${pnp(p)}${m.rev.imp.includes(p.id)?' 🎭':''}</td><td class="n ${R.d[p.id]<0?'r':R.d[p.id]>0?'g':''}">${R.d[p.id]>0?'+':''}${R.d[p.id]}</td><td class="n"><b>${p.sc}</b></td></tr>`).join('')}</table></section>`:'')
  +(H?`<button class="p" onclick="mx('next')">${R.last?'Zurück zur Lobby':turn?'Nächste Runde':'Noch eine Runde'}</button>`:`<p class="c mut">Das Spiel geht weiter.</p>`);
 }
 show('<div class="bar"><button class="x" aria-label="Raum verlassen" onclick="leave()">✕</button><button class="x" aria-label="Regeln" onclick="rules(\'mpBack\')">?</button></div>'+h+off,keep||!fresh);tick();
}
boot();
</script>
</body>
</html>
