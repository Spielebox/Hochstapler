:root{--felt:#173a2f;--ivory:#f3ecd9;--ink:#1c211e;--mut:#a9bfae;--brass:#d3a94b;--red:#b3261e;--line:rgba(243,236,217,.22)}
*{box-sizing:border-box}
html,body,button,a,summary,input{touch-action:manipulation}
button,summary,.chip{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--felt);color:var(--ivory);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:520px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}
h1,h2,.big{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:700}
h1{font-size:40px;margin:10px 0 0;line-height:1.1}
h2{font-size:24px;margin:16px 0 8px;line-height:1.2}
p{margin:6px 0}.mut{color:var(--mut)}.c{text-align:center}
section{border-top:1px solid var(--line);padding:14px 0 6px;margin-top:12px}
button{font:inherit;color:var(--ivory);background:transparent;border:1px solid var(--line);border-radius:10px;padding:13px 16px;width:100%;margin:6px 0;cursor:pointer}
button.p{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:700}
button:disabled{opacity:.4;cursor:default}
button.on{border-color:var(--brass);background:rgba(211,169,75,.18)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.seg button{margin:0}
input{font:inherit;color:var(--ink);background:var(--ivory);border:0;border-radius:10px;padding:12px;width:100%}
.chip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:5px 12px;margin:3px 4px 3px 0}
.chip b{cursor:pointer;color:var(--mut)}
.step{flex:none;width:46px;padding:10px;margin:0}
.big{font-size:38px;text-align:center;margin:14px 0;line-height:1.15}
.face{position:relative;background:var(--ivory);color:var(--ink);border-radius:16px;padding:48px 20px;margin:12px 0;text-align:center}
.face::before,.face::after{content:attr(data-s);position:absolute;font-size:26px;line-height:1}
.face::before{top:12px;left:16px}.face::after{bottom:12px;right:16px;transform:rotate(180deg)}
.face.h{color:var(--red)}
.face p{color:var(--ink)}.face .mut{color:#5b665f}
table{width:100%;border-collapse:collapse}td,th{padding:7px 2px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}.n{text-align:right;white-space:nowrap;padding-left:10px}
.tag{font-size:13px;border-radius:8px;padding:2px 8px;background:var(--red);color:var(--ivory)}
.g{color:#9be0a8}.r{color:#ffa79d}
details{border-top:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;margin:6px 0;font-weight:700}
a.chip{color:var(--ivory);text-decoration:none}
.bar{display:flex;justify-content:space-between;margin-bottom:-8px}.bar .x{margin:0}
details p,details li{color:var(--ivory)}
.x{display:block;width:44px;height:44px;padding:0;margin:0 0 -8px;border-radius:50%;font-size:20px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;min-height:98px;margin:0;padding:8px 4px;font-size:13px;line-height:1.25;border-radius:12px;overflow-wrap:anywhere;hyphens:auto;opacity:.55}
.cat.on{opacity:1}.cat.ro{pointer-events:none}
.cat i{font-style:normal;font-size:24px;line-height:1}
</style>
</head>

try{Object.assign(C,JSON.parse(localStorage.getItem('hochstapler')||'{}'))}catch(e){}
if(!Array.isArray(C.cats))C.cats=CATS.map(c=>c.id);C.cats=C.cats.filter(id=>CATS.some(c=>c.id===id));if(!Array.isArray(C.lv))C.lv=LV.includes(C.lv)?[C.lv]:[...LV];C.lv=LV.filter(v=>C.lv.includes(v));if(!C.lv.length)C.lv=[...LV];if(!HN[C.hint])C.hint='cat';
const save=()=>{try{localStorage.setItem('hochstapler',JSON.stringify(C))}catch(e){}};

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const maxK=n=>Math.max(1,Math.floor((n-1)/2));

/* Einrichtung */
function set(k,v){C[k]=v;save();setup(true)}
function chg(k,d){C[k]+=d;if(k==='max')C.maxAuto=false;C.rounds=Math.min(20,Math.max(1,C.rounds));save();setup(true)}
function add(){const v=$('nm').value.trim();if(v&&!C.names.includes(v)&&C.names.length<20){C.names.push(v);save()}setup();const e=$('nm');if(e)e.focus()}
function rm(i){C.names.splice(i,1);save();setup()}
function setup(keep){
 inGame=false;
 const n=C.names.length,geh=C.mode==='geheim',lim=maxK(n),minN=geh?5:4;
 C.k=Math.min(Math.max(C.k,1),lim);
 if(C.maxAuto!==false)C.max=Math.max(2,Math.floor(n/3));
 C.max=Math.min(Math.max(C.max,2),Math.max(2,lim));
 show(`<button class="x" aria-label="Zurück" onclick="home()">←</button><h1>Hochstapler</h1><p class="mut">Ein Handy, das reihum geht</p>

 <p class="mut">Mindestens ${minN} Spieler</p></section>
 <section><b>Spielart</b>${seg([['blitz','Blitzrunde'],['turnier','Turnier']],C.type,'type')}${C.type==='turnier'?stp('Runden',C.rounds,"chg('rounds',-1)","chg('rounds',1)"):''}</section>
 <section><b>Hochstapler</b>${seg([['bekannt','Anzahl bekannt'],['geheim','Geheim']],C.mode,'mode')}
 ${geh?stp('Maximal',C.max,"chg('max',-1)","chg('max',1)")+'<p class="mut">Die echte Anzahl wird zufällig zwischen 1 und dem Maximum gewählt.</p>':stp('Anzahl',C.k,"chg('k',-1)","chg('k',1)")}</section>
 <section><b>Kategorien</b><p class="mut">${C.cats.length} von ${CATS.length} gewählt</p><button onclick="catPage()">Kategorien wählen</button></section>
 <section><b>Schwierigkeit</b>${lvBtns(C.lv,'lvTog')}<p class="mut">Mehrere wählbar. Alle drei ergeben eine Mischung.</p></section>
 <section><b>Hochstapler sieht</b>${seg(Object.entries(HN),C.hint,'hint')}<p class="mut">Die Kategorie des Wortes oder nichts.</p></section>
 <section><b>Wortgedächtnis</b><p class="mut">Gespielt: ${usedN()} von ${CATS.length*60} Wörtern. Kein Wort kommt doppelt, bis alle der Auswahl gespielt wurden.</p><button onclick="resetUsed()">Zurücksetzen</button></section>
 <section><b>Timer für die Diskussion</b><div class="row seg">${[0,1,2,3,5].map(v=>`<button class="${C.timer===v?'on':''}\" onclick="set('timer',${v})">${v||'Aus'}</button>`).join('')}</div><p class="mut">Minuten. Bei Ablauf erscheint nur ein Hinweis.</p></section>
 <button class="p" style="margin-top:18px" ${n>=minN&&C.cats.length?'':'disabled'} onclick="start()">Spiel starten</button>
 <button onclick="rules('setup')">Regeln</button>
 <p class="c mut" style="margin-top:18px;font-size:14px">Version ${VERSION}</p>`,keep);
}

function lvTog(v){const i=C.lv.indexOf(v);if(i>=0){if(C.lv.length>1)C.lv.splice(i,1)}else C.lv.push(v);C.lv=LV.filter(x=>C.lv.includes(x));save();setup(true)}
function usedN(){try{return JSON.parse(localStorage.getItem('hs_used')||'[]').length}catch(e){return 0}}

 <div class="row seg"><button onclick="catAll(1)">Alle</button><button onclick="catAll(0)">Keine</button></div>${catGrid(CATS,C.cats,'catTog')}
 <button class="p" style="margin-top:14px" onclick="setup()">Fertig</button>`,keep)}
function catTog(id){const i=C.cats.indexOf(id);if(i>=0)C.cats.splice(i,1);else C.cats.push(id);save();catPage(true)}
function catAll(a){C.cats=a?CATS.map(c=>c.id):[];save();catPage(true)}

/* Regeln */
function mpBack(){inRules=false;lastPh='';mp()}
function rules(b){inRules=(b==='mpBack');
 show(`<button class="x" aria-label="Zurück" onclick="${b}()">←</button><h2>Regeln</h2>
 <details open><summary>Ablauf einer Runde</summary><ol>
 <li>Jeder sieht privat sein Wort. Der Hochstapler kennt es nicht und blufft sich durch.</li>
 <li>Hinweisrunde: Reihum nennt jeder laut ein Hinweiswort, nicht zu deutlich.</li>
 <li>Danach wird frei diskutiert.</li>
 <li>Abstimmung: Jeder tippt verdeckt auf Verdächtige. Auch die Hochstapler stimmen mit, ihre Tipps zählen aber nicht.</li>
 <li>Auflösung: Enttarnt ist, wer von mindestens der Hälfte der Mitspieler (ohne Hochstapler, aufgerundet) getippt wurde.</li>
 <li>Wort raten: Jeder Hochstapler hat einen Versuch und sagt das Wort laut, auch wenn er nicht enttarnt wurde. Die anderen bestätigen, ob es stimmt.</li></ol></details>
 <details><summary>Spielmodi</summary>
 <p><b>Blitzrunde:</b> Eine Runde ohne Punkte. Der Hochstapler gewinnt, wenn er nicht enttarnt wurde oder das Wort errät. Die Mitspieler gewinnen, wenn alle Hochstapler enttarnt wurden und keiner das Wort geraten hat.</p>
 <p><b>Turnier:</b> Mehrere Runden mit Punkten, am Ende gewinnt, wer die meisten hat.</p>
 <p><b>Anzahl bekannt:</b> Alle wissen, wie viele Hochstapler es gibt, und tippen genau so viele Spieler.</p>
 <p><b>Geheim:</b> Die Anzahl ist unbekannt und wird zufällig zwischen 1 und dem eingestellten Maximum gewählt. Jeder tippt beliebig viele Spieler.</p></details>
 <details><summary>Punkte im Turnier</summary>
 <p><b>Hochstapler</b></p>
 <table><tr><td>Nicht enttarnt</td><td class="n">+2</td></tr><tr><td>Wort erraten</td><td class="n">+2</td></tr></table>
 <p><b>Mitspieler</b></p>
 <table><tr><td>Alle Hochstapler enttarnt, keiner rät das Wort (Team)</td><td class="n">+1 für alle</td></tr>
 <tr><td>Tipp auf einen enttarnten Hochstapler</td><td class="n">+1</td></tr>
 <tr><td>Alle Hochstapler getippt (ab 2 Hochstaplern)</td><td class="n">+1</td></tr></table>
 <p><b>Nur im Geheim-Modus</b></p>
 <table><tr><td>Tipp auf einen Hochstapler zählt auch ohne Enttarnung</td><td class="n">+1</td></tr>
 <tr><td>Pro Tipp mehr als es Hochstapler gibt (dann keine Treffer-Punkte)</td><td class="n">−1</td></tr></table>
 <p class="mut">Beispiel: Ein Hochstapler wird enttarnt und rät falsch. Er bekommt 0 Punkte, alle Mitspieler +1 (Team), wer ihn getippt hat, noch +1 dazu, also 2.</p></details>
 <details><summary>Wörter und Kategorien</summary>
 <p>Es gibt ${CATS.length} Kategorien mit je 60 Wörtern (leicht, mittel, schwer). Gewählt werden eine oder mehrere Kategorien, das Wort jeder Runde kommt zufällig aus einer davon.</p>
 <p>Kein Wort wiederholt sich, bis alle Wörter der Auswahl gespielt wurden, auch über Runden und Spiele hinweg.</p>
 <p>Der Hochstapler sieht je nach Einstellung die Kategorie des Wortes oder nichts.</p></details>
 <button class="p" style="margin-top:16px" onclick="${b}()">Zurück</button>`,0,1);
}

/* Runde */
function drawWord(){
 let U=[];try{U=JSON.parse(localStorage.getItem('hs_used')||'[]')}catch(e){}
 const P=[];CATS.filter(c=>C.cats.includes(c.id)).forEach(c=>c.w.forEach((l,i)=>{if(C.lv.includes(LV[i]))l.forEach(w=>P.push({w,c:c.id}))}));
 let p=P.filter(x=>!U.includes(x.w));
 if(!p.length){const ws=P.map(x=>x.w);U=U.filter(w=>!ws.includes(w));p=P}
 const r=p[Math.random()*p.length|0];U.push(r.w);
 try{localStorage.setItem('hs_used',JSON.stringify(U))}catch(e){}
 return r}
function catIntro(){const s=C.cats;show(`<h2>Kategorien dieser Runde</h2><p class="mut">Das Wort stammt aus einer dieser Kategorien.</p>${catGrid(CATS.filter(c=>s.includes(c.id)),s)}<button class="p" style="margin-top:14px" onclick="hand(0,'role')">Weiter</button>`)}
function start(){SC={};C.names.forEach(x=>SC[x]=0);RN=1;newRound()}
function newRound(){
 inGame=true;
 const P=C.names,k=C.mode==='geheim'?1+(Math.random()*C.max|0):C.k;
 const r=drawWord();
 G={k,imp:shuffle(P).slice(0,k),word:r.w,cat:r.c,votes:{},guess:{},start:P[Math.random()*P.length|0]};
 catIntro();
}
function hand(i,ph){
 const P=C.names;
 if(i>=P.length){ph==='role'?talk():result1();return}
 show(`<p class="c mut" style="margin-top:56px">Gib das Handy an</p><div class="big">${esc(P[i])}</div>
 <button class="p" onclick="${ph==='role'?'showRole':'vote'}(${i})">${ph==='role'?'Rolle ansehen':'Tipp abgeben'}</button>`);
}
function showRole(i){
 const p=C.names[i],h=G.imp.includes(p),b=C.mode==='bekannt';
 show(h?`<div class="face h" data-s="♥"><p class="mut">${esc(p)}, du bist</p><div class="big">der Hochstapler</div><p>Du kennst das Wort nicht. Hör gut zu und bluffe dich durch.</p><p class="mut">${b?`Es gibt ${G.k} Hochstapler.`:'Wie viele Hochstapler es gibt, weißt du nicht.'}</p>${C.hint==='cat'?catLine(G.cat):''}</div>`
 :`<div class="face" data-s="♠"><p class="mut">${esc(p)}, dein Wort</p><div class="big">${esc(G.word)}</div><p class="mut">${b?`Unter euch ${G.k==1?'ist 1 Hochstapler':'sind '+G.k+' Hochstapler'}.`:`Unter euch sind höchstens ${C.max} Hochstapler.`}</p>${catLine(G.cat)}</div>`);
 $('app').insertAdjacentHTML('beforeend',`<button class="p" onclick="hand(${i+1},'role')">Verstanden, Handy weitergeben</button>`);
}
function talk(){
 TEND=C.timer?Date.now()+C.timer*60000:0;OFF=0;
 const P=C.names,s=P.indexOf(G.start),o=P.map((_,j)=>P[(s+j)%P.length]);
 show(`${C.type==='turnier'?`<p class="mut">Runde ${RN} von ${C.rounds}</p>`:''}<h2>Hinweisrunde</h2>${C.timer?'<p id="tm" class="c mut"></p>':''}
 <p>Reihum sagt jeder laut ein Hinweiswort. Nicht zu deutlich, sonst erkennt es der Hochstapler.</p>
 <section><b>Reihenfolge</b><ol>${o.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section>${catDet(C.cats)}
 <p>Danach wird frei diskutiert. Wenn ihr bereit seid:</p><button class="p" onclick="hand(0,'vote')">Zur Abstimmung</button>`);tick();
}

/* Abstimmung */
function vote(i){SEL=[];ballot(i)}
function ballot(i,keep){
 const p=C.names[i],g=C.mode==='geheim',ok=g?SEL.length>=1:SEL.length===G.k;
 show(`<h2>${esc(p)}, wer ist verdächtig?</h2><p class="mut">${g?'Wähle beliebig viele Verdächtige. Wer mehr tippt, als es Hochstapler gibt, verliert Punkte.':`Es gibt ${G.k} Hochstapler. Wähle genau ${G.k}.`}</p>`
 +C.names.map((x,j)=>j===i?'':`<button class="${SEL.includes(x)?'on':''}" onclick="tg(${i},${j})">${SEL.includes(x)?'✓ ':''}${esc(x)}</button>`).join('')
 +`<button class="p" style="margin-top:14px" ${ok?'':'disabled'} onclick="G.votes[C.names[${i}]]=[...SEL];hand(${i+1},'vote')">Tipp abgeben (${SEL.length}${g?'':' von '+G.k})</button>`,keep);
}
function tg(i,j){const x=C.names[j],a=SEL.indexOf(x);if(a>=0)SEL.splice(a,1);else if(C.mode==='geheim'||SEL.length<G.k)SEL.push(x);else if(G.k===1)SEL=[x];ballot(i,true)}

/* Auswertung */
function result1(){
 const P=C.names,I=G.imp,V=P.filter(x=>!I.includes(x)),th=Math.ceil(V.length/2);
 G.cnt={};P.forEach(x=>G.cnt[x]=V.filter(v=>G.votes[v].includes(x)).length);
 G.ent={};I.forEach(h=>G.ent[h]=G.cnt[h]>=th);
 const s=[...P].sort((a,b)=>G.cnt[b]-G.cnt[a]);
 show(`<h2>Auflösung</h2><p class="mut">Enttarnt ist, wer von mindestens ${th} der ${V.length} Mitspieler getippt wurde. Tipps der Hochstapler zählen nicht.</p>
 <section><table>${s.map(x=>`<tr><td>${esc(x)} ${I.includes(x)?'<span class="tag">Hochstapler</span>':''}</td><td class="n">${G.cnt[x]} Stimmen</td></tr>`).join('')}</table></section>
 ${I.map(h=>`<p>${G.ent[h]?'🔍':'😎'} <b>${esc(h)}</b> ${G.ent[h]?'wurde enttarnt.':'blieb unentdeckt.'}</p>`).join('')}
 <details><summary>Wer hat wen getippt?</summary>${P.map(x=>`<p>${esc(x)} tippt auf ${G.votes[x].map(esc).join(', ')}</p>`).join('')}</details>
 <button class="p" onclick="guess(0)">Weiter zum Wort raten</button>`);
}
function guess(j){
 const h=G.imp[j];
 if(!h){result2();return}
 show(`<h2>${esc(h)} rät das Wort</h2><p>${esc(h)} nennt laut einen Begriff, nur ein Versuch. Alle anderen kennen das Wort und entscheiden:</p>
 <button class="p" onclick="ans(${j},true)">Richtig</button><button onclick="ans(${j},false)">Falsch</button>`);
}
function ans(j,v){G.guess[G.imp[j]]=v;guess(j+1)}
function result2(){
 const P=C.names,I=G.imp,V=P.filter(x=>!I.includes(x)),geh=C.mode==='geheim',turn=C.type==='turnier';
 const won={};I.forEach(h=>won[h]=!G.ent[h]||G.guess[h]);
 const allLost=I.every(h=>!won[h]),d={};P.forEach(x=>d[x]=0);
 I.forEach(h=>d[h]=(G.ent[h]?0:2)+(G.guess[h]?2:0));
 V.forEach(v=>{const t=G.votes[v];let s=allLost?1:0;
  if(geh){if(t.length>G.k)s-=t.length-G.k;else{const h=t.filter(x=>I.includes(x)).length;s+=h;if(G.k>1&&h===G.k)s++}}
  else{const h=t.filter(x=>G.ent[x]).length;s+=h;if(G.k>1&&h===G.k)s++}
  d[v]=s});
 if(turn)P.forEach(x=>SC[x]+=d[x]);
 const W=allLost?V:I.filter(h=>won[h]),last=turn&&RN>=C.rounds,S=[...P].sort((a,b)=>SC[b]-SC[a]);
 show(`<p class="c mut" style="margin-top:12px">Das Wort war</p><div class="big" style="margin-top:0">${esc(G.word)}</div><div class="c">${catLine(G.cat)}</div>
 <section class="c"><b>${allLost?'Die Mitspieler gewinnen':W.length>1?'Es gewinnen die Hochstapler':'Es gewinnt der Hochstapler'}</b><p>${W.map(esc).join(', ')}</p></section>
 ${turn?`<section><b>${last?'Endstand':`Stand nach Runde ${RN} von ${C.rounds}`}</b><table><tr><th>Spieler</th><th class="n">Runde</th><th class="n">Gesamt</th></tr>${S.map(x=>`<tr><td>${last&&x===S[0]?'🥇 ':''}${esc(x)}${I.includes(x)?' 🎭':''}</td><td class="n ${d[x]<0?'r':d[x]>0?'g':''}">${d[x]>0?'+':''}${d[x]}</td><td class="n"><b>${SC[x]}</b></td></tr>`).join('')}</table></section>`:''}
 ${turn?(last?'<button class="p" onclick="setup()">Neues Spiel</button>':'<button class="p" onclick="RN++;newRound()">Nächste Runde</button>'):'<button class="p" onclick="newRound()">Noch eine Runde</button>'}`);
}
/* Multiplayer */
const catMx=id=>mx('cfg',{k:'cat',v:id}),lvMx=v=>mx('cfg',{k:'lv',v});
function catSec(c,H){
 return `<section><b>Kategorien (${c.cats.length} von ${CATS.length})</b>${H?`<div class="row seg" style="margin-top:8px"><button onclick="mx('cfg',{k:'catall',v:1})">Alle</button><button onclick="mx('cfg',{k:'catall',v:0})">Keine</button></div>`:''}${catGrid(CATS,c.cats,H?'catMx':'')}</section>`
 +(H?`<section><b>Schwierigkeit</b>${lvBtns(c.lv,'lvMx')}<p class="mut">Mehrere wählbar.</p></section><section><b>Hochstapler sieht</b>${cseg(Object.entries(HN),c.hint,'hint')}</section>
 <section><b>Wortgedächtnis</b><p class="mut">Gilt für alle Räume. Kein Wort kommt doppelt, bis alle der Auswahl gespielt wurden.</p><button onclick="if(confirm('Wortgedächtnis zurücksetzen? Danach können sich Wörter wieder wiederholen.'))mx('resetwords')">Zurücksetzen</button></section>`
  :`<section><p class="mut">Schwierigkeit: ${(c.lv||LV).map(v=>LVN[v]).join(', ')} · Hochstapler sieht: ${HN[c.hint]||'Kategorie'}</p></section>`)}
const API='https://hochstapler.spam-lama.workers.dev';
const TEST=new URLSearchParams(location.search).has('test'),store=TEST?sessionStorage:localStorage;
let TOK=null;try{TOK=localStorage.getItem('hs_tok')}catch(e){}
let ws=null,M=null,mpOn=false,myCode='',lastPh='',inRules=false;
const jpost=(path,b)=>fetch(API+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});
const mx=(t,x)=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({t,...x}))};
function gate(msg){inGame=false;show(`<h1>Hochstapler</h1><p class="mut">Bitte Passwort eingeben</p><input id="pw" type="password" autocomplete="current-password" placeholder="Passwort" onkeydown="if(event.key==='Enter')login()"><button class="p" style="margin-top:12px" onclick="login()">Weiter</button>${msg?`<p class="r">${msg}</p>`:''}`)}
async function login(){const r=await jpost('/api/login',{pw:$('pw').value}).catch(()=>null);if(!r)return gate('Keine Verbindung zum Server.');if(!r.ok)return gate('Passwort falsch.');TOK=(await r.json()).token;try{localStorage.setItem('hs_tok',TOK)}catch(e){}home()}
function boot(){const q=new URLSearchParams(location.search).get('raum');
 if(q){const tn=new URLSearchParams(location.search).get('name'),qc=q.toUpperCase().replace(/[^A-Z]/g,'');if(TEST&&tn)return connect(qc,tn);return nameScreen(q)}
 if(!TOK)return gate();
 fetch(API+'/api/check?token='+TOK).then(r=>r.ok?home():gate()).catch(()=>home())}
function home(){inGame=false;mpOn=false;if(ws){try{ws.close()}catch(e){}}
 show(`<h1>Hochstapler</h1><p class="mut">Wer kennt das Wort nicht?</p>
 <button class="p" style="margin-top:24px" onclick="create()">Raum erstellen</button>
 <section><b>Raum beitreten</b><div class="row" style="margin-top:8px"><input id="rc" placeholder="Raumcode" maxlength="4" style="text-transform:uppercase"><button style="flex:none;width:110px;margin:0" onclick="nameScreen($('rc').value)">Weiter</button></div></section>
 <section><button onclick="setup()">Ein Handy (Pass-and-Play)</button><button onclick="rules('home')">Regeln</button></section>
 <p class="c mut" style="margin-top:18px;font-size:14px">Version ${VERSION}</p>`)}
async function create(){const r=await jpost('/api/create',{token:TOK}).catch(()=>null);
 if(!r)return alert('Der Server ist nicht erreichbar.');if(r.status===401)return gate('Bitte neu anmelden.');if(!r.ok)return alert('Der Raum konnte nicht erstellt werden.');
 nameScreen((await r.json()).code)}
function nameScreen(code){code=(code||'').trim().toUpperCase().replace(/[^A-Z]/g,'');if(code.length!==4)return alert('Der Raumcode hat 4 Buchstaben.');
 let n='';try{n=store.getItem('hs_name')||''}catch(e){}
 show(`<button class="x" aria-label="Zurück" onclick="home()">←</button><h2>Raum ${code}</h2><p class="mut">Wie heißt du?</p><input id="nm2" maxlength="14" value="${esc(n)}" placeholder="Name" onkeydown="if(event.key==='Enter')join('${code}')"><button class="p" style="margin-top:12px" onclick="join('${code}')">Beitreten</button>`)}
function join(code){const n=$('nm2').value.trim();if(!n)return;try{store.setItem('hs_name',n)}catch(e){}connect(code,n)}
function connect(code,name){myCode=code;mpOn=true;inGame=false;
 let pid=null;try{pid=store.getItem('hs_pid_'+code)}catch(e){}
 let got=false;const w=ws=new WebSocket(API.replace(/^http/,'ws')+'/ws?raum='+code);
 w.onopen=()=>w.send(JSON.stringify({t:'join',name,pid}));
 w.onmessage=e=>{got=true;const m=JSON.parse(e.data);
  if(m.t==='me'){try{store.setItem('hs_pid_'+code,m.pid)}catch(x){}}
  else if(m.t==='note'){alert(m.e)}
  else if(m.t==='err'){mpOn=false;try{w.close()}catch(x){}alert(m.e);home()}
  else{M=m;OFF=(m.now||Date.now())-Date.now();if(!inRules)mp()}};
 w.onclose=()=>{if(!mpOn||ws!==w)return;if(!got){mpOn=false;alert('Der Raum wurde nicht gefunden oder der Server ist nicht erreichbar.');home()}else setTimeout(()=>mpOn&&connect(code,name),1500)}}
function leave(){
 if(M&&M.me===M.host&&M.ph!=='lobby'){if(confirm('Spiel für alle beenden und zurück zur Lobby?'))mx('end')}
 else if(confirm('Raum verlassen? Mit dem Raumcode kommst du wieder hinein.'))home()}
const qrImg=u=>{try{if(typeof qrcode!=='function')return '';const q=qrcode(0,'M');q.addData(u);q.make();return `<div class="c" style="margin:8px 0"><img alt="QR-Code zum Beitreten" src="${q.createDataURL(5,2)}" style="width:190px;height:190px;image-rendering:pixelated;border-radius:8px"></div>`}catch(e){return ''}};
function kick(id){const p=M.players.find(x=>x.id===id);if(p&&confirm(p.name+' aus dem Raum entfernen?'))mx('kick',{id})}
function share(){const u=location.origin+location.pathname+'?raum='+myCode;
 if(navigator.share)navigator.share({title:'Hochstapler',text:'Komm in meinen Raum '+myCode,url:u}).catch(()=>{});
 else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>alert('Link kopiert'))}
function tg2(id){const a=SEL.indexOf(id);if(a>=0)SEL.splice(a,1);else if(M.cfg.mode==='geheim'||SEL.length<M.k)SEL.push(id);else if(M.k===1)SEL=[id];mp(true)}
const cseg=(o,cur,k)=>`<div class="row seg">${o.map(([v,l])=>`<button class="${v===cur?'on':''}" onclick="mx('cfg',{k:'${k}',v:'${v}'})">${l}</button>`).join('')}</div>`;
const cstp=(l,v,k)=>stp(l,v,`mx('cfg',{k:'${k}',d:-1})`,`mx('cfg',{k:'${k}',d:1})`);
function mp(keep){
 const m=M,P=m.players,c=m.cfg,H=m.me===m.host,n=P.length,minN=c.mode==='geheim'?5:4,b=c.mode==='bekannt';
 const nm=id=>esc((P.find(p=>p.id===id)||{name:'?'}).name);
 TEND=m.ph==='talk'&&m.tend?m.tend:0;
 const offl=P.filter(p=>!p.on);let off='';
 if(H&&m.ph!=='lobby'&&m.ph!=='result'&&offl.length){const nn=offl.map(p=>esc(p.name)).join(', '),okr=n-offl.length>=minN;off=`<section><p class="mut">Nicht verbunden: ${nn}</p><button ${okr?'':'disabled'} onclick="mx('restart')">Runde ohne ${nn} neu starten</button>${okr?'':'<p class="mut">Dafür sind zu wenige Spieler übrig.</p>'}</section>`}
 const fresh=m.ph!==lastPh;if(fresh&&m.ph==='vote')SEL=[];lastPh=m.ph;
 let h='';
 if(m.ph==='lobby'){
  h=`<h2>Raum</h2><div class="big" style="letter-spacing:6px">${m.code}</div>${qrImg(location.origin+location.pathname+'?raum='+m.code)}<button onclick="share()">Einladungslink teilen</button>
  <section><b>Spieler (${n})</b><div>${P.map(p=>`<span class="chip">${p.on?'●':'○'} ${esc(p.name)}${p.id===m.host?' ★':''}${H&&p.id!==m.host?` <b onclick="kick('${p.id}')">✕</b>`:''}</span>`).join('')}</div><p class="mut">Mindestens ${minN} Spieler</p></section>`
  +(TEST?`<section><b>Testmodus</b><p class="mut">Weitere Spieler in neuen Tabs öffnen:</p>${[2,3,4,5,6].map(i=>`<a class="chip" target="_blank" rel="noopener" href="${location.origin+location.pathname}?raum=${m.code}&test=1&name=Spieler%20${i}">Spieler ${i}</a>`).join('')}</section>`:'')
  +(H?`<section><b>Spielart</b>${cseg([['blitz','Blitzrunde'],['turnier','Turnier']],c.type,'type')}${c.type==='turnier'?cstp('Runden',c.rounds,'rounds'):''}</section>
  <section><b>Hochstapler</b>${cseg([['bekannt','Anzahl bekannt'],['geheim','Geheim']],c.mode,'mode')}${b?cstp('Anzahl',c.k,'k'):cstp('Maximal',c.max,'max')}</section>
  ${catSec(c,true)}
  <section><b>Timer für die Diskussion</b><div class="row seg">${[0,1,2,3,5].map(v=>`<button class="${(c.timer||0)===v?'on':''}" onclick="mx('cfg',{k:'timer',v:${v}})">${v||'Aus'}</button>`).join('')}</div><p class="mut">Minuten</p></section>
  <button class="p" style="margin-top:16px" ${n>=minN&&c.cats&&c.cats.length?'':'disabled'} onclick="mx('start')">Spiel starten</button>`
  :`<section><p>${c.type==='turnier'?`Turnier mit ${c.rounds} Runden`:'Blitzrunde'}, ${b?`${c.k} Hochstapler`:`Geheim mit höchstens ${c.max} Hochstaplern`}.</p><p class="mut">${c.timer?`Timer: ${c.timer} Min. `:''}${nm(m.host)} startet das Spiel.</p></section>`+(c.cats?catSec(c,false):''))
  +`<button onclick="rules('mpBack')">Regeln</button><p class="c mut" style="margin-top:18px;font-size:14px">Version ${VERSION} · Server ${m.wv||'veraltet'}</p>`;
 }else if(m.ph==='role'){const r=m.role,k=m.k;
  h=r.seen?`<h2 class="c" style="margin-top:56px">Warte auf die anderen</h2><p class="c mut">${r.n} von ${n} haben ihre Rolle gesehen.</p>`
  :(r.imp?`<div class="face h" data-s="♥"><p class="mut">Du bist</p><div class="big">der Hochstapler</div><p>Du kennst das Wort nicht. Hör gut zu und bluffe dich durch.</p><p class="mut">${b?`Es gibt ${k} Hochstapler.`:'Wie viele Hochstapler es gibt, weißt du nicht.'}</p>${r.cat?catLine(r.cat):''}</div>`
   :`<div class="face" data-s="♠"><p class="mut">Dein Wort</p><div class="big">${esc(r.word)}</div><p class="mut">${b?`Unter euch ${k==1?'ist 1 Hochstapler':'sind '+k+' Hochstapler'}.`:`Unter euch sind höchstens ${c.max} Hochstapler.`}</p>${r.cat?catLine(r.cat):''}</div>`)
   +`<button class="p" onclick="mx('seen')">Verstanden</button>`;
 }else if(m.ph==='talk'){
  h=`${c.type==='turnier'?`<p class="mut">Runde ${m.round} von ${c.rounds}</p>`:''}<h2>Hinweisrunde</h2>${m.tend?'<p id="tm" class="c mut"></p>':''}<p>Reihum sagt jeder laut ein Hinweiswort. Nicht zu deutlich, sonst erkennt es der Hochstapler.</p>
  <section><b>Reihenfolge</b><ol>${m.order.map(i=>`<li>${nm(i)}</li>`).join('')}</ol></section>${c.cats?catDet(c.cats):''}<p>Danach wird frei diskutiert.</p>`
  +(H?`<button class="p" onclick="mx('next')">Zur Abstimmung</button>`:`<p class="c mut">${nm(m.host)} startet die Abstimmung.</p>`);
 }else if(m.ph==='vote'){const ok=b?SEL.length===m.k:SEL.length>=1;
  h=`<h2>Wer ist verdächtig?</h2>`+(m.my?`<p class="mut">Dein Tipp ist abgegeben: ${m.my.map(nm).join(', ')}.</p><p class="c">${m.voted} von ${n} haben getippt.</p>`
   :`<p class="mut">${b?`Es gibt ${m.k} Hochstapler. Wähle genau ${m.k}.`:'Wähle beliebig viele Verdächtige. Wer mehr tippt, als es Hochstapler gibt, verliert Punkte.'}</p>`
   +P.map(p=>p.id===m.me?'':`<button class="${SEL.includes(p.id)?'on':''}" onclick="tg2('${p.id}')">${SEL.includes(p.id)?'✓ ':''}${esc(p.name)}</button>`).join('')
   +`<button class="p" style="margin-top:14px" ${ok?'':'disabled'} onclick="mx('vote',{ids:SEL})">Tipp abgeben (${SEL.length}${b?' von '+m.k:''})</button>`);
 }else if(m.ph==='reveal'){const r=m.rev,S=[...P].sort((a,z)=>r.cnt[z.id]-r.cnt[a.id]);
  h=`<h2>Auflösung</h2><p class="mut">Enttarnt ist, wer von mindestens ${r.th} der ${r.nv} Mitspieler getippt wurde. Tipps der Hochstapler zählen nicht.</p>
  <section><table>${S.map(p=>`<tr><td>${esc(p.name)} ${r.imp.includes(p.id)?'<span class="tag">Hochstapler</span>':''}</td><td class="n">${r.cnt[p.id]} Stimmen</td></tr>`).join('')}</table></section>
  ${r.imp.map(i=>`<p>${r.ent[i]?'🔍':'😎'} <b>${nm(i)}</b> ${r.ent[i]?'wurde enttarnt.':'blieb unentdeckt.'}</p>`).join('')}
  <details><summary>Wer hat wen getippt?</summary>${P.map(p=>`<p>${esc(p.name)} tippt auf ${(r.votes[p.id]||[]).map(nm).join(', ')}</p>`).join('')}</details>`
  +(H?`<button class="p" onclick="mx('next')">Weiter zum Wort raten</button>`:`<p class="c mut">Das Spiel geht weiter.</p>`);
 }else if(m.ph==='guess'){const gu=m.guesser,jd=m.judge;
  h=`<h2>${nm(gu)} rät das Wort</h2>`+(m.me===jd?`<p>${nm(gu)} nennt laut einen Begriff, nur ein Versuch. Stimmt es?</p><button class="p" onclick="mx('ans',{v:true})">Richtig</button><button onclick="mx('ans',{v:false})">Falsch</button>`
   :m.me===gu?`<p>Nenne laut einen Begriff, nur ein Versuch.</p><p class="mut">${nm(jd)} entscheidet, ob es stimmt.</p>`
   :`<p>${nm(gu)} nennt laut einen Begriff. ${nm(jd)} entscheidet, ob es stimmt.</p>`);
 }else if(m.ph==='result'){const R=m.res,turn=c.type==='turnier',S=[...P].sort((a,z)=>z.sc-a.sc);
  h=`<p class="c mut" style="margin-top:12px">Das Wort war</p><div class="big" style="margin-top:0">${esc(R.word)}</div>${R.cat?`<div class="c">${catLine(R.cat)}</div>`:''}
  <section class="c"><b>${R.allLost?'Die Mitspieler gewinnen':R.W.length>1?'Es gewinnen die Hochstapler':'Es gewinnt der Hochstapler'}</b><p>${R.W.map(nm).join(', ')}</p></section>`
  +(turn?`<section><b>${R.last?'Endstand':`Stand nach Runde ${m.round} von ${c.rounds}`}</b><table><tr><th>Spieler</th><th class="n">Runde</th><th class="n">Gesamt</th></tr>${S.map(p=>`<tr><td>${R.last&&p===S[0]?'🥇 ':''}${esc(p.name)}${m.rev.imp.includes(p.id)?' 🎭':''}</td><td class="n ${R.d[p.id]<0?'r':R.d[p.id]>0?'g':''}">${R.d[p.id]>0?'+':''}${R.d[p.id]}</td><td class="n"><b>${p.sc}</b></td></tr>`).join('')}</table></section>`:'')
  +(H?`<button class="p" onclick="mx('next')">${R.last?'Zurück zur Lobby':turn?'Nächste Runde':'Noch eine Runde'}</button>`:`<p class="c mut">Das Spiel geht weiter.</p>`);
 }
 show('<div class="bar"><button class="x" aria-label="Raum verlassen" onclick="leave()">✕</button><button class="x" aria-label="Regeln" onclick="rules(\'mpBack\')">?</button></div>'+h+off,keep||!fresh);tick();
}
boot();
</script>
</body>
</html>
